[settings]
# Read the packageManager / devEngines fields in package.json. Disabled by default; must be explicitly enabled.
# My projects are pinned to 4 pnpm versions (11.21.0 / 11.19.0 / 10.10.0 / 10.8.1),
# and this is what lets me switch per project — corepack used to handle this.
#
# Note that mise only recognizes devEngines, not the traditional engines.node (jdx/mise#2288 hasn't been merged).
# The engines.node fields in my 46 projects all resolve to 24, the same as the global version below, so there's no impact;
# if I really need to switch node per project in the future, I'll need to use mise.toml or .node-version.
idiomatic_version_file_enable_tools = ["node", "pnpm", "npm", "yarn"]

# Supply-chain protection: only install versions published at least N time ago, giving the community time to discover compromised releases.
# mise defaults to 24h; disabled here — I publish npm packages myself, so I need to be able to install and verify them as soon as they're published.
# To keep the protection without blocking my own packages, you can use minimum_release_age_excludes instead to allow only your own scope.
minimum_release_age = "0"

# npm: Keep the backend at its default (built-in aube); don't switch to npm/pnpm — that would mean removing supply-chain protection for all packages
# because of a problem with an individual package. When aube blocks something, make a minimal exception for that package in [tools]:
#
#   trust_policy_excludes  Allow a trust downgrade (an older version had a trusted publisher signature, but the newer one doesn't)
#   allow_builds           Allow build scripts such as postinstall for that package
#
# Both apply only to that one tool; other packages are unaffected.

# mise frequently checks GitHub Releases, and the anonymous quota is only 60 requests/hour, so it's easy to hit the rate limit.
# The gh token is stored in the keyring, and hosts.yml is empty, so mise's default lookup path can't retrieve it.
# Fetch it on demand with a command: the token isn't written to disk or added to environment variables, and exists only when mise actually needs it.
[settings.github]
credential_command = "gh auth token"

# Use the npm CLI to install npm: packages, rather than mise's built-in aube.
# aube's trustPolicy=no-downgrade blocks indirect dependencies whose trust level has dropped — when installing
# pi-coding-agent, it was blocked by @smithy/core@3.33.0 (earlier versions had a trusted publisher signature, but the newer one doesn't;
# AWS didn't use a trusted workflow, so the package wasn't tampered with).
#
# Note that the npm backend still uses --ignore-scripts by default. Packages that need postinstall must have
# allow_builds = true set for them individually in [tools], or they'll be installed in an incomplete state.
[tools]
node = "lts"
java = "lts"         # Fallback value. For projects that need JDK 8 / 17, override the
pnpm = "latest"      # fallback value in the project's mise.toml; if a project has a packageManager field, follow the project's
yarn = "latest"      # fallback value. Repositories using v1 must declare this themselves in the packageManager field —
                     # running them with Yarn 4 will migrate the lockfile in place to the Berry format.
"npm:@antfu/ni" = "latest"
"npm:taze" = "latest"

# The exceptions for these two apply only to themselves; other packages still get a full check from aube
"npm:opencode-ai" = { version = "latest", allow_builds = true }   # postinstall needs to download a 170MB platform binary; without allowing it, the install is incomplete
"npm:@earendil-works/pi-coding-agent" = { version = "latest", trust_policy_excludes = ["@smithy/core", "@smithy/node-http-handler", "@smithy/util-stream", "@smithy/fetch-http-handler", "@smithy/middleware-retry"] }   # The AWS SDK dependency chain doesn't have trusted publisher signatures on newer versions
usage = "latest"     # A dependency for mise completions. brew installs it automatically with mise,
vercel = { version = "latest", allow_builds = ["esbuild"], trust_policy_excludes = ["undici"] }   # The two exceptions are added automatically by mise use: esbuild has a postinstall script, and undici hits no-downgrade
                     # If you switch to the official installer / winget, you'll need to declare them yourself, or every time you open a shell it'll
                     # warn "usage CLI not found"
