onboarding = false

[ui]
agent_panel_sort = "priority"

[theme]
name = "terminal"
auto_switch = false

[ui.toast]
delivery = "system"

# On Windows, you must explicitly specify pwsh.
# The pane's shell defaults to $SHELL, which falls back to the built-in Windows PowerShell 5.1
# on Windows rather than PowerShell 7 — their $PROFILE files are different (WindowsPowerShell\ and
# PowerShell\), so settings configured in 7 won't take effect in 5.1.
# After editing, run `herdr server reload-config`, or simply open a new pane.
# To check which one is running in the current pane: $PSVersionTable.PSVersion (5.1.x means the older one)
#
# [terminal]
# default_shell = "pwsh.exe"
# shell_mode can be "auto" / "login" / "non_login"; it controls whether new panes start as login shells;
# "auto" uses a login shell on macOS
